name: Codeforces AutoPush

on:
  schedule:
    # Run every 30 minutes
    - cron: "*/30 * * * *"
  workflow_dispatch: # Allow manual trigger from GitHub UI

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check environment configuration
        env:
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
          CF_API_SECRET: ${{ secrets.CF_API_SECRET }}
          CF_HANDLE: ${{ secrets.CF_HANDLE }}
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
          GITHUB_REPO: ${{ secrets.TARGET_REPO }}
        run: |
          test -n "$CF_API_KEY" && echo "CF_API_KEY is set" || echo "CF_API_KEY is missing"
          test -n "$CF_API_SECRET" && echo "CF_API_SECRET is set" || echo "CF_API_SECRET is missing"
          test -n "$CF_HANDLE" && echo "CF_HANDLE is set" || echo "CF_HANDLE is missing"
          test -n "$GITHUB_TOKEN" && echo "GITHUB_TOKEN is set" || echo "GITHUB_TOKEN is missing"
          test -n "$GITHUB_REPO" && echo "GITHUB_REPO is set" || echo "GITHUB_REPO is missing"
